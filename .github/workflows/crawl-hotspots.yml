name: 时事热点自动抓取
on:
  schedule:
    # 北京时间 12:00 与 20:00（对应 UTC 04:00 / 12:00）
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  repository_dispatch:
    types: [crawl-hotspots]
  workflow_dispatch:

permissions:
  contents: write

# 串行化：多个触发（定时+手动连点）排队执行，避免并发 git push 互相拒绝（fetch first）
concurrency:
  group: crawl-hotspots
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取时事热点
        run: python tools/crawl_hotspots.py

      - name: 提交并更新站点
        run: |
          git config user.name "hotspots-bot"
          git config user.email "bot@kaogong.local"
          # 只提交抓取脚本真正写出、且线上实际提供服务的根路径文件
          # （仓库已拍平，根目录下没有 site/ 目录，引用 site/... 会让 git add 直接报错导致整个抓取失败）
          git add assets/data/hotspots.js assets/data/hotspot_history.js
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            # [railway skip]：纯数据提交无需重新部署后端，避免 Railway 反复构建/失败通知
            git commit -m "chore: 时事热点自动抓取 $(date +'%Y-%m-%d %H:%M') [railway skip]"
            git pull --rebase origin main
            git push || { sleep 3; git pull --rebase origin main && git push; }
          fi
