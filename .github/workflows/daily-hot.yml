name: 每日时政热点（每晚20点自动生成）
on:
  # ⚠定时任务已暂停（2026-10-09）：仓库未配强模型（AI_MODEL/AI_API_BASE 为空，落回 glm-4-flash），
  # 实测言语 5 题连续 5 次输出非法 JSON、时政 10 题被乱出题过滤剔掉 7-8 道，
  # 自动跑只会把已校验的好内容覆盖成垃圾。等配好更强的模型密钥后再放开。
  # schedule:
  #   - cron: "30 12 * * *"   # 北京时间 20:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hot
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成今日时政与题目（失败 60 秒后自动整跑重试一次）
        continue-on-error: true   # 生成失败不再把整个 job 标红；后续提交步骤照常走（无变化会自动跳过）
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          python tools/gen_daily_hot.py || {
            echo "第一次生成失败，60 秒后自动重试…"
            sleep 60
            python tools/gen_daily_hot.py
          }

      - name: 提交静态数据源（始终基于最新远端重写，杜绝并发冲突）
        run: |
          git config user.name "daily-hot-bot"
          git config user.email "bot@kaogong.local"
          ok=0
          for i in 1 2 3 4; do
            echo "第 $i 次尝试提交…"
            git fetch origin main
            git reset --hard origin/main
            python tools/patch_daily_hot.py
            git add assets/data/daily_hot.js
            if git diff --cached --quiet; then
              echo "无变化，跳过提交"
              ok=1; break
            fi
            git commit -m "chore: 每日时政热点自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            if git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "四次提交尝试均失败"; exit 1; }
