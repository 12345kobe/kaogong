name: 每日时政热点（每晚20点自动生成）
on:
  schedule:
    # ★用户 2026-10-14 要求：北京 20:00 正点主跑（此前 19:00 档被嫌太早）。
    #   20:30 档兜底补跑；「今天已有 verbal≥4 且 quiz≥8 则跳过不覆盖」门禁保留。
    #   注：仓库必须配好 secrets（AI_API_KEY / AI_API_BASE / AI_MODEL），否则写不进内容。
    - cron: "0 12 * * *"      # UTC 12:00 = 北京 20:00（正点主跑）
    - cron: "30 12 * * *"     # UTC 12:30 = 北京 20:30（兜底补跑）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hot
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成今日时政与题目（失败 60 秒后自动整跑重试一次）
        continue-on-error: true   # 生成失败不再把整个 job 标红；后续提交步骤照常走（无变化会自动跳过）
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          python tools/gen_daily_hot.py || {
            echo "第一次生成失败，60 秒后自动重试…"
            sleep 60
            python tools/gen_daily_hot.py
          }

      - name: 提交静态数据源（始终基于最新远端重写，杜绝并发冲突）
        run: |
          git config user.name "daily-hot-bot"
          git config user.email "bot@kaogong.local"
          ok=0
          for i in 1 2 3 4; do
            echo "第 $i 次尝试提交…"
            git fetch origin main
            git reset --hard origin/main
            python tools/patch_daily_hot.py
            git add assets/data/daily_hot.js
            if git diff --cached --quiet; then
              echo "无变化，跳过提交"
              ok=1; break
            fi
            git commit -m "chore: 每日时政热点自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            if git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "四次提交尝试均失败"; exit 1; }
