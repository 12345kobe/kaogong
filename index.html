<!-- 启动页：按主题+横竖屏显示对应图片，展示约2秒自动进入（期间完成云端拉取与设置恢复）；右下角小字版本号随每次更新变化 -->
<div id="kgSplash"><span id="kgSplashVer">v=20260923a</span></div>
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem("kg_desk_state_v1")||"{}");
  var n=(s.theme&&s.theme.name)||"wuxia";
  if(n!=="cute"&&n!=="cyber"&&n!=="custom"&&n!=="minimal")n="wuxia"; /* minimal 等其余主题沿用武侠启动图 */
  var p=window.matchMedia&&window.matchMedia("(orientation: portrait)").matches;
  var img="assets/splash/"+n+"-"+(p?"p":"l")+".jpg";
  var d=document.getElementById("kgSplash");
  if(d){var im=new Image();im.onload=function(){d.style.backgroundImage="url('"+img+"')";};im.src=img;}
}catch(e){}})();
</script>
<!-- 白噪音（雨声）常驻音频：跨模块持续播放，由顶栏「🎧 白噪音」按钮控制 -->
<audio id="whiteNoise" src="assets/audio/white-noise.ogg" loop preload="auto"></audio>
<div id="app">

  <aside id="sidebar">

    </div>
  </aside>

  <!-- 右侧主区 -->
  <main id="main">
    <!-- 顶部常驻栏 -->
    <header id="topbar">
      <div class="top-left">
        <button id="menuToggle" class="icon-btn" title="菜单">☰</button>
        <div id="clock" class="clock">--:--:--</div>
        <button id="themeBtn" class="icon-btn" title="切换深/浅色模式（白天自动护眼）">🌓</button>
        <button id="helpBtn" class="icon-btn" title="使用说明书">❓</button>
        <button id="whiteNoiseBtn" class="icon-btn wn-btn" title="点击播放/关闭背景音">🎧</button>
        <div id="todayDate" class="today-date"></div>
        <button id="topTimer" class="icon-btn" style="display:none" title="计时中，点此查看"></button>
      </div>
      <div class="top-center">
        <div id="dailyQuote" class="daily-quote"> Loading… </div>
      </div>
      <div class="top-right">
        <button id="checkinBtn" class="checkin-btn">今日打卡</button>
        <button id="accountBtn" class="icon-btn" title="账号">👤</button>
      </div>
    </header>

    <!-- 内容区 -->
    <section id="content">
      <div id="pageTitle" class="page-title"></div>
      <div id="pageBody" class="page-body"></div>
    </section>
  </main>
