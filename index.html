<div id="app">
  <!-- 左侧导航 -->
  <aside id="sidebar">
    <div class="brand">

      <div class="brand-text">
        <div class="brand-title">考公工作台</div>
        <div class="brand-sub">个人备考助手</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button id="syncBtn" class="sync-btn" title="云端同步 / 账号">☁ 未同步</button>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <main id="main">
    <!-- 顶部常驻栏 -->
    <header id="topbar">
      <div class="top-left">
        <button id="menuToggle" class="icon-btn" title="菜单">☰</button>
        <div id="clock" class="clock">--:--:--</div>
        <button id="themeBtn" class="icon-btn" title="切换深/浅色模式（白天自动护眼）">🌓</button>
        <div id="todayDate" class="today-date"></div>
      </div>
      <div class="top-center">
        <div id="dailyQuote" class="daily-quote"> Loading… </div>
      </div>
      <div class="top-right">
        <button id="checkinBtn" class="checkin-btn">今日打卡</button>
        <button id="accountBtn" class="icon-btn" title="账号">👤</button>
      </div>
    </header>

    <!-- 内容区 -->
    <section id="content">
      <div id="pageTitle" class="page-title"></div>
      <div id="pageBody" class="page-body"></div>
    </section>
  </main>
</div>
